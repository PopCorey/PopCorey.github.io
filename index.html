<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at center, #18243b, #0b1020 70%);
        color: #f1f5f9;
        font-family: system-ui, sans-serif;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 10vw, 6rem);
        font-weight: 700;
        letter-spacing: -0.05em;
        text-align: center;
        animation: appear 900ms ease-out both;
      }

      h1::after {
        content: "";
        display: block;
        width: 64px;
        height: 4px;
        margin: 24px auto 0;
        border-radius: 999px;
        background: #60a5fa;
        animation: pulse 3s ease-in-out infinite;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pulse {
        50% {
          opacity: 0.45;
          transform: scaleX(0.75);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        h1,
        h1::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <h1>Hello World</h1>
  </body>
</html>
